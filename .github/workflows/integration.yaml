name: Ligne Jaune - Integration

on:
  push:
    branches:
      - main
      - feat/01-fondations

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: PostgreSQL / Symfony / API
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Generate ephemeral test secrets
        shell: bash
        run: |
          set -euo pipefail

          umask 077
          mkdir -p .secrets
          chmod 700 .secrets

          openssl rand -hex 32 > .secrets/db_password
          openssl rand -hex 32 > .secrets/app_db_password
          openssl rand -hex 32 > .secrets/api_access_token

          chmod 600 .secrets/*

      - name: Check Bash syntax
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(
            find scripts tests/api \
              -type f -name '*.sh' -print0
          )

      - name: Validate Docker Compose
        run: |
          docker compose -f compose.test.yaml config --quiet

      - name: Install Symfony dependencies
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e COMPOSER_HOME=/tmp/composer \
            -v "$PWD/apps/api:/app" \
            -w /app \
            composer:2 install \
              --no-interaction \
              --no-progress \
              --prefer-dist \
              --no-scripts

          test -f apps/api/vendor/autoload_runtime.php

      - name: Run integration tests
        run: |
          ./scripts/test-integration.sh

      - name: Stop test containers
        if: always()
        run: |
          docker compose -f compose.test.yaml \
            down --remove-orphans
