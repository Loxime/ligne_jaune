api_health:
    path: /api/health
    controller: App\Controller\HealthController::__invoke
    methods: [GET]

api_database_health:
    path: /api/health/db
    controller: App\Controller\DatabaseHealthController::__invoke
    methods: [GET]

api_entities_index:
    path: /api/entities
    controller: App\Controller\EntityIndexController::__invoke
    methods: [GET]

api_entities_create:
    path: /api/entities
    controller: App\Controller\EntityCreateController::__invoke
    methods: [POST]

api_entity_show:
    path: /api/entities/{id}
    controller: App\Controller\EntityShowController::__invoke
    methods: [GET]

api_sources_index:
    path: /api/sources
    controller: App\Controller\SourceIndexController::__invoke
    methods: [GET]

api_source_show:
    path: /api/sources/{id}
    controller: App\Controller\SourceShowController::__invoke
    methods: [GET]

api_sources_create:
    path: /api/sources
    controller: App\Controller\SourceCreateController::__invoke
    methods: [POST]

api_entity_identifiers_index:
    path: /api/entities/{id}/identifiers
    controller: App\Controller\EntityIdentifierController::index
    methods: [GET]

api_entity_identifiers_create:
    path: /api/entities/{id}/identifiers
    controller: App\Controller\EntityIdentifierController::create
    methods: [POST]
