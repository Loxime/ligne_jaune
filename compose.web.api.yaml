services:
  web:
    environment:
      NUXT_API_BASE_URL: http://api:8080
      NUXT_API_TOKEN_FILE: /run/secrets/api_access_token

      LJ_AUTH_SESSION_KEY_FILE: /run/secrets/lj_web_session_key
      LJ_AUTH_PASSWORD_HASH_FILE: /run/secrets/lj_web_admin_hash
      LJ_AUTH_SESSION_STORE_DIR: /var/lib/ligne-jaune/sessions

    secrets:
      - api_access_token
      - lj_web_session_key
      - lj_web_admin_hash

    volumes:
      - ./.secrets/lj_web_sessions:/var/lib/ligne-jaune/sessions

    networks:
      - default
      - symfony_application

networks:
  symfony_application:
    external: true
    name: ligne-jaune-dev_application

secrets:
  api_access_token:
    file: ./.secrets/api_access_token

  lj_web_session_key:
    file: ./.secrets/lj_web_session_key

  lj_web_admin_hash:
    file: ./.secrets/lj_web_admin.hash
