name: ligne-jaune-web-dev

services:
  web:
    image: node:24-alpine

    init: true

    working_dir: /app

    environment:
      NUXT_TELEMETRY_DISABLED: "1"

    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules

    ports:
      - "127.0.0.1:3073:3000"

    command:
      - sh
      - -c
      - |
        corepack enable
        pnpm install --frozen-lockfile
        exec pnpm dev --host 0.0.0.0 --port 3000

volumes:
  web_node_modules:
